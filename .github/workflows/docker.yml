name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deskpark

jobs:
  image:
    name: Build · Smoke test · Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      # 1) 先构建本机架构镜像并实际运行，确认健康检查、网页与接口都正常
      - name: Build (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: deskpark:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name dp -p 8787:8787 deskpark:test
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dp)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' dp)" = "healthy" ]
          curl -fsS http://localhost:8787/healthz
          curl -fsS http://localhost:8787/ | grep -q '闲亭'
          curl -fsS -o /dev/null http://localhost:8787/room/ABCD
          docker logs dp
          docker rm -f dp

      # 2) 推送多架构镜像（PR 只构建不推送）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build & push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
