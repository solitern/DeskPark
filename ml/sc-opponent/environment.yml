# 四川麻将导师：对手模型训练环境
#   conda env create -f ml/sc-opponent/environment.yml
# PyTorch 用 CUDA 12.8 版（RTX 50 系显卡需要 CUDA 12.8 及以上）。
# 国内网络从阿里云镜像下载；在国外可以把下面两行换成
#   --index-url https://pypi.org/simple
#   --extra-index-url https://download.pytorch.org/whl/cu128
name: deskpark-ml
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --index-url https://mirrors.aliyun.com/pypi/simple/
      - --find-links https://mirrors.aliyun.com/pytorch-wheels/cu128/
      - torch==2.11.0+cu128
      - numpy
      - scikit-learn
